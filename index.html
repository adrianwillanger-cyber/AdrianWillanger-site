<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adrian Willanger | Intelligence, AI Systems & Governance</title>

  <meta name="description"
        content="Real estate intelligence, practical AI workflow systems, and AI governance frameworks from Adrian Willanger.">

  <style>
    :root {
      --espresso: #28140d;
      --brown: #3a1f14;
      --copper: #d76f32;
      --copper-dark: #b85522;
      --white: #ffffff;
      --off-white: #f8f7f5;
      --text: #2b2927;
      --muted: #706b67;
      --border: #e7e2de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    /* HEADER */

    header {
      background: var(--espresso);
      color: var(--white);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      font-size: 1.25rem;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .brand span {
      color: var(--copper);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: .9rem;
    }

    .nav-links a:hover {
      color: var(--copper);
    }

    .nav-button {
      background: var(--copper);
      padding: 10px 18px;
      border-radius: 4px;
      font-weight: 700;
    }

    .nav-button:hover {
      background: var(--copper-dark);
      color: white !important;
    }

    /* HERO */

    .hero {
      background:
        radial-gradient(circle at 85% 25%, rgba(215,111,50,.13), transparent 28%),
        linear-gradient(135deg, #201009 0%, #351b11 100%);
      color: var(--white);
      padding: 110px 0 120px;
    }

    .hero-content {
      max-width: 850px;
    }

    .eyebrow {
      color: var(--copper);
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 6vw, 5.6rem);
      line-height: .98;
      font-weight: 400;
      margin-bottom: 27px;
    }

    .hero h1 span {
      color: var(--copper);
    }

    .hero-subtitle {
      max-width: 720px;
      font-size: 1.25rem;
      color: rgba(255,255,255,.82);
      margin-bottom: 38px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 4px;
      font-weight: 700;
      transition: .2s ease;
    }

    .button-primary {
      background: var(--copper);
      color: var(--white);
    }

    .button-primary:hover {
      background: var(--copper-dark);
    }

    .button-secondary {
      border: 1px solid rgba(255,255,255,.45);
      color: var(--white);
    }

    .button-secondary:hover {
      background: rgba(255,255,255,.08);
    }

    /* INTRO */

    .intro {
      padding: 90px 0 45px;
      text-align: center;
    }

    .intro h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 400;
      margin-bottom: 18px;
    }

    .intro p {
      max-width: 760px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.08rem;
    }

    /* THREE PILLARS */

    .pillars {
      padding: 35px 0 100px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      border: 1px solid var(--border);
      padding: 36px 32px;
      background: var(--white);
      min-height: 330px;
      display: flex;
      flex-direction: column;
    }

    .card-number {
      color: var(--copper);
      font-family: Georgia, serif;
      font-size: 1.5rem;
      margin-bottom: 24px;
    }

    .card h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 400;
      margin-bottom: 14px;
    }

    .card p {
      color: var(--muted);
      margin-bottom: 25px;
      flex-grow: 1;
    }

    .card a {
      color: var(--copper-dark);
      font-weight: 700;
    }

    /* REAL ESTATE FEATURE */

    .feature {
      background: var(--off-white);
      padding: 95px 0;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
</html>
